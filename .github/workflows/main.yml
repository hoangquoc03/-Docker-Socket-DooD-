name: Build, push, and verify delivery-service

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize GHCR image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/delivery-service" >> "$GITHUB_OUTPUT"

      - name: Build multi-stage image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

      - name: Pull image back from GHCR
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Run and verify container
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          container_id="$(docker run --detach --name delivery-service-verify \
            --publish 8080:8080 "${IMAGE_NAME}:${GITHUB_SHA}")"

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo
              docker ps --filter "id=${container_id}" --format '{{.Names}} {{.Status}}'
              exit 0
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]]; then
              docker logs "$container_id"
              exit 1
            fi

            sleep 1
          done

          docker logs "$container_id"
          exit 1

      - name: Remove verification container
        if: always()
        run: docker rm --force delivery-service-verify 2>/dev/null || true
