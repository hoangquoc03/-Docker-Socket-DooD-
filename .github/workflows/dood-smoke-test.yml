name: DooD smoke test

on:
  push:
  workflow_dispatch:

jobs:
  docker-smoke-test:
    runs-on: [self-hosted, Linux, X64, dood]
    steps:
      - name: Check Docker daemon connection
        run: docker info

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag quickbite-dood-smoke:${GITHUB_SHA} .

      - name: Run built image
        run: docker run --rm quickbite-dood-smoke:${GITHUB_SHA}
